version: "3"


tasks:
  default:
    cmds:
      - task --list
    silent: true

  format:
    desc: "Format terraform files"
    cmds:
      - terraform fmt -recursive .

  docs:
    desc: "Generate terraform docs"
    cmds:
      - terraform-docs markdown table --output-file README.md --output-mode inject .

  parity:
    desc: "Check modules/deploy-managed is what the root module plus scripts/parity.py generates"
    cmds:
      - ./scripts/parity.py check

  parity:update:
    desc: "Regenerate modules/deploy-managed from the root module"
    cmds:
      - ./scripts/parity.py update

kind: Added
body: '`modules/deploy-managed`, a copy of the root module that hands the image, the
  container environment and the traffic split to a deploy tool rather than to Terraform.
  It exists as a copy because `lifecycle` `ignore_changes` takes a static list of attribute
  references, so the behaviour cannot be made opt-in with a variable'

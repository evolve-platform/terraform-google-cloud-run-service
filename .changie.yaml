changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
# `Changed` and `Removed` are minor rather than major while this module is pre-1.0:
# the release runs `changie batch auto` on every merge, and a major from 0.x lands
# on 1.0.0 -- a statement about stability that a breaking change to one submodule
# should not be making on its own. Releasing 1.0.0 means batching it by hand.
kinds:
    - label: Added
      auto: minor
    - label: Changed
      auto: minor
    - label: Deprecated
      auto: minor
    - label: Removed
      auto: minor
    - label: Fixed
      auto: patch
    - label: Security
      auto: patch
newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 1
    endOfVersion: 1
envPrefix: CHANGIE_
